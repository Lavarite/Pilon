name: CI

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  commits:
    name: Commit message style
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check scoped commit message style
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .github/scripts/commit-lint-ci.sh
      - name: Select checks for the changed files or tag
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 .github/scripts/ci_scope_tests.py
          python3 .github/scripts/ci_scope.py

  linux:
    name: Linux build and regression tests
    needs: commits
    if: needs.commits.outputs.scope == 'full' || needs.commits.outputs.scope == 'release'
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 45
    env:
      LC_ALL: C.UTF-8
      TZ: Etc/UTC
      PILON_DEV_DIR: /tmp/pilon-ci-dev
      PILON_GOOGLE_CLIENT_ID: ${{ github.ref_type == 'tag' && needs.commits.outputs.scope == 'release' && vars.PILON_GOOGLE_CLIENT_ID || '' }}
      PILON_MICROSOFT_CLIENT_ID: ${{ github.ref_type == 'tag' && needs.commits.outputs.scope == 'release' && vars.PILON_MICROSOFT_CLIENT_ID || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the Arch Linux build and test dependencies
        run: |
          pacman -Syu --noconfirm --needed archlinux-keyring git cmake ninja pkgconf \
            qt6-base qt6-declarative qt6-multimedia qt6-svg libssh2 dbus openssh \
            curl ffmpeg libreoffice-fresh poppler python uv noto-fonts tzdata
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test AUR publishing rules
        run: bash .github/scripts/update-aur-tests.sh
      - name: Install pinned Codex test runtime
        run: |
          mkdir -p "$PILON_DEV_DIR/dev-deps/ci-tools"
          cd "$PILON_DEV_DIR/dev-deps/ci-tools"
          curl --fail --silent --show-error --location --retry 3 \
            'https://github.com/openai/codex/releases/download/rust-v0.167.0/codex-x86_64-unknown-linux-musl.tar.gz' \
            --output codex.tar.gz
          printf '%s  %s\n' '9d64836106d5b374e90ee4454c7ebcde7ca7106558bd7e41a34b9f26ebda251a' codex.tar.gz | sha256sum --check
          tar -xzf codex.tar.gz
          mv codex-x86_64-unknown-linux-musl codex
          rm codex.tar.gz
      - name: Prepare the Linux test user and runtimes
        run: |
          useradd -m -p '*' pilon-ci
          mkdir -p /run/sshd
          chown -R pilon-ci:pilon-ci "$GITHUB_WORKSPACE"
          chown -R pilon-ci:pilon-ci "$PILON_DEV_DIR"
          runuser -u pilon-ci -- bash -euo pipefail -c '
            bash src/scripts/setup_documents.sh
            bash addons/assistant/scripts/setup_litert.sh
          '
      - name: Build Pilon and its test binaries
        run: |
          runuser -u pilon-ci -- env \
            "PATH=$PILON_DEV_DIR/dev-deps/ci-tools:$PATH" \
            "PILON_GOOGLE_CLIENT_ID=$PILON_GOOGLE_CLIENT_ID" \
            "PILON_MICROSOFT_CLIENT_ID=$PILON_MICROSOFT_CLIENT_ID" \
            bash -euo pipefail -c '
            cmake -S src -B "$PILON_DEV_DIR/builds/work/linux" -G Ninja -DCMAKE_BUILD_TYPE=Release -DPILON_BUILD_TESTS=ON
            cmake --build "$PILON_DEV_DIR/builds/work/linux" --parallel 4
          '
      - name: Run the Linux regression tests
        run: |
          runuser -u pilon-ci -- env "PATH=$PILON_DEV_DIR/dev-deps/ci-tools:$PATH" bash -euo pipefail -c '
            codex --version
            ctest --test-dir "$PILON_DEV_DIR/builds/work/linux" --parallel 2 --no-tests=error --output-on-failure
          '
      - name: Verify and package Linux and source archives
        if: github.ref_type == 'tag' && needs.commits.outputs.scope == 'release'
        run: runuser -u pilon-ci -- bash .github/scripts/package-linux.sh "$GITHUB_REF_NAME"
      - name: Upload tested release packages
        if: github.ref_type == 'tag' && needs.commits.outputs.scope == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: /tmp/pilon-ci-dev/builds/releases/ci/
          if-no-files-found: error
          retention-days: 1

  addons:
    name: Add-on checks
    needs: commits
    if: needs.commits.outputs.scope == 'full' || needs.commits.outputs.scope == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test and build the Calendar add-on sharing frontend
        working-directory: addons/calendar/server/frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Audit Calendar add-on sharing runtime dependencies
        working-directory: addons/calendar/server/frontend
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test the Calendar add-on sharing backend
        working-directory: addons/calendar/server/backend
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests

  android:
    name: Android host tests
    needs: commits
    if: needs.commits.outputs.scope == 'full' || needs.commits.outputs.scope == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK platform 37.0
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-37.0/android.jar" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
          fi
      - name: Run Android packaging, Java, resolver and runtime checks
        run: bash .github/scripts/android-host-checks.sh

  passed:
    name: ${{ github.ref_type == 'tag' && 'Tag checks passed' || 'CI passed' }}
    if: ${{ always() && !github.event.deleted }}
    needs: [commits, linux, addons, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable check
        env:
          CI_SCOPE: ${{ needs.commits.outputs.scope }}
          CHECK_RESULTS: ${{ format('{0} {1} {2} {3}', needs.commits.result, needs.linux.result, needs.addons.result, needs.android.result) }}
        run: |
          case "$CI_SCOPE" in
            full|release) test "$CHECK_RESULTS" = "success success success success" ;;
            style) test "$CHECK_RESULTS" = "success skipped skipped skipped" ;;
            *) exit 1 ;;
          esac

  draft:
    name: Prepare release draft
    if: github.ref_type == 'tag' && needs.commits.outputs.scope == 'release'
    needs: [passed, commits]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version tag on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$DEFAULT_BRANCH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-assets
          path: ${{ runner.temp }}/pilon-release-assets/
      - name: Prepare GitHub draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            test "$draft" = true
            gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/pilon-release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/pilon-release-assets/* --verify-tag --draft \
              --title "Pilon $version" \
              --notes 'Linux x86-64 and source archives are validated in CI.'
          fi
